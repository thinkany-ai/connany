name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connany
          POSTGRES_PASSWORD: connany
          POSTGRES_DB: connany_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connany"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://connany:connany@localhost:5432/connany_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_DATABASE_URL: postgres://connany:connany@localhost:5432/connany_test
